<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro Blogging Application</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #10152e, #29123e);
            color: #222;
            padding: 20px;
        }

        /* Main heading */
        h1 {
            text-align: center;
            color: white;
            font-size: 38px;
            margin-bottom: 65px;
        }

        /* Post form */
        .container {
            width: 100%;
            max-width: 825px;
            margin-left: 8.5%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .form-header {
            background: #e9edf2;
            padding: 22px 28px;
        }

        .form-header h2 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 23px;
            color: #777;
        }

        .form-body {
            padding: 22px 28px 28px;
        }

        label {
            display: block;
            font-size: 18px;
            margin-bottom: 9px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 14px 12px;
            border: 2px solid #ddd;
            border-radius: 13px;
            font-family: inherit;
            font-size: 17px;
            margin-bottom: 22px;
            outline: none;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #6650d9;
        }

        textarea {
            height: 155px;
            resize: vertical;
        }

        /* Buttons */
        .button-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .post-button {
            flex: 1;
            padding: 14px;
            background: #6550d9;
            color: white;
            border: none;
            border-radius: 11px;
            font-size: 18px;
            cursor: pointer;
        }

        .post-button:hover {
            background: #503bc3;
        }

        .icon-button {
            width: 56px;
            height: 52px;
            border: none;
            border-radius: 12px;
            background: #f0f0f4;
            font-size: 25px;
            cursor: pointer;
        }

        .icon-button:hover {
            background: #dedaf7;
        }

        #imageInput {
            display: none;
        }

        #imagePreview {
            display: none;
            max-width: 100%;
            max-height: 250px;
            margin-bottom: 18px;
            border-radius: 10px;
        }

        #status {
            margin-top: 14px;
            color: #503bc3;
            font-size: 14px;
        }

        /* Published posts */
        .posts-section {
            width: 100%;
            max-width: 825px;
            margin: 30px 0 40px 8.5%;
        }

        .posts-section h2 {
            color: white;
            margin-bottom: 18px;
        }

        .post-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 18px;
            overflow-wrap: anywhere;
        }

        .post-card h3 {
            color: #5540bd;
            margin-bottom: 12px;
        }

        .post-card p {
            font-size: 17px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .post-card img {
            width: 100%;
            max-height: 350px;
            object-fit: contain;
            margin-top: 15px;
            border-radius: 8px;
        }

        .post-location {
            color: #666;
            font-size: 14px !important;
            margin-top: 12px;
        }

        .delete-button {
            margin-top: 15px;
            padding: 8px 14px;
            background: #eee9ff;
            color: #503bc3;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        /* Responsive layout */
        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            h1 {
                font-size: 28px;
                margin-bottom: 35px;
            }

            .container,
            .posts-section {
                margin-left: auto;
                margin-right: auto;
            }

            .form-header {
                padding: 18px;
            }

            .form-header h2 {
                font-size: 22px;
            }

            .form-header p {
                font-size: 18px;
            }

            .form-body {
                padding: 18px;
            }

            .button-row {
                gap: 8px;
            }

            .icon-button {
                width: 45px;
                height: 48px;
            }
        }
    </style>
</head>

<body>

    <h1>Micro Blogging Application</h1>

    <div class="container">

        <div class="form-header">
            <h2>Create Post</h2>
            <p>Share your thoughts, @User!</p>
        </div>

        <div class="form-body">

            <form id="postForm">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="@your_handle"
                    required
                    maxlength="30"
                >

                <label for="message">What's happening?</label>
                <textarea
                    id="message"
                    placeholder="Type your message here..."
                    maxlength="1000"
                ></textarea>

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                >

                <img id="imagePreview" alt="Selected image preview">

                <div class="button-row">

                    <button type="submit" class="post-button">
                        Post
                    </button>

                    <button
                        type="button"
                        class="icon-button"
                        id="imageButton"
                        aria-label="Upload image"
                        title="Upload image"
                    >
                        <svg width="24" height="24"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="1.8">
                            <rect x="3" y="3" width="18"
                                  height="18" rx="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <path d="M21 15l-5-5L5 21"/>
                        </svg>
                    </button>

                    <button
                        type="button"
                        class="icon-button"
                        id="locationButton"
                        aria-label="Add location"
                        title="Add location"
                    >
                        <svg width="24" height="24"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="1.8">
                            <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
                            <circle cx="12" cy="10" r="2.5"/>
                        </svg>
                    </button>

                </div>

                <p id="status" role="status"></p>

            </form>
        </div>
    </div>

    <section class="posts-section">
        <h2>Recent Posts</h2>
        <div id="postsContainer"></div>
    </section>

    <script>
        const form = document.getElementById("postForm");
        const usernameInput = document.getElementById("username");
        const messageInput = document.getElementById("message");
        const imageInput = document.getElementById("imageInput");
        const imagePreview = document.getElementById("imagePreview");
        const status = document.getElementById("status");
        const postsContainer = document.getElementById("postsContainer");

        let selectedImage = "";
        let selectedLocation = "";

        // Open image selector
        document.getElementById("imageButton").addEventListener("click", function () {
            imageInput.click();
        });

        // Preview selected image
        imageInput.addEventListener("change", function () {
            const file = imageInput.files[0];

            if (!file) {
                return;
            }

            if (!file.type.startsWith("image/")) {
                status.textContent = "Please select an image file.";
                imageInput.value = "";
                return;
            }

            if (file.size > 3 * 1024 * 1024) {
                status.textContent = "Please choose an image smaller than 3 MB.";
                imageInput.value = "";
                return;
            }

            const reader = new FileReader();

            reader.onload = function (event) {
                selectedImage = event.target.result;
                imagePreview.src = selectedImage;
                imagePreview.style.display = "block";
                status.textContent = "Image selected successfully.";
            };

            reader.readAsDataURL(file);
        });

        // Get location with user's permission
        document.getElementById("locationButton").addEventListener("click", function () {
            if (!navigator.geolocation) {
                status.textContent = "Location is not supported by this browser.";
                return;
            }

            status.textContent = "Requesting location permission...";

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    selectedLocation =
                        "Latitude: " + position.coords.latitude.toFixed(4) +
                        ", Longitude: " + position.coords.longitude.toFixed(4);

                    status.textContent = "Location added successfully.";
                },
                function () {
                    status.textContent =
                        "Location unavailable. Allow browser location permission and try again.";
                }
            );
        });

        // Publish post
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const username = usernameInput.value.trim();
            const message = messageInput.value.trim();

            if (!username) {
                status.textContent = "Please enter your username.";
                return;
            }

            if (!message && !selectedImage) {
                status.textContent = "Please write a message or select an image.";
                return;
            }

            const card = document.createElement("article");
            card.className = "post-card";

            const heading = document.createElement("h3");
            heading.textContent = username.startsWith("@")
                ? username
                : "@" + username;

            card.appendChild(heading);

            if (message) {
                const paragraph = document.createElement("p");
                paragraph.textContent = message;
                card.appendChild(paragraph);
            }

            if (selectedImage) {
                const image = document.createElement("img");
                image.src = selectedImage;
                image.alt = "Post image";
                card.appendChild(image);
            }

            if (selectedLocation) {
                const locationText = document.createElement("p");
                locationText.className = "post-location";
                locationText.textContent = "📍 " + selectedLocation;
                card.appendChild(locationText);
            }

            const deleteButton = document.createElement("button");
            deleteButton.className = "delete-button";
            deleteButton.textContent = "Delete Post";

            deleteButton.addEventListener("click", function () {
                card.remove();
            });

            card.appendChild(deleteButton);

            postsContainer.prepend(card);

            form.reset();
            selectedImage = "";
            selectedLocation = "";
            imagePreview.src = "";
            imagePreview.style.display = "none";
            status.textContent = "Your post has been published!";
        });
    </script>

</body>
</html>
